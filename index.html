<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PassGen">
<meta name="theme-color" content="#000080">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Password Generator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Поведение как у приложения: без «потянуть, чтобы обновить», без масштабирования и выделения */
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: #008080;
  position: fixed;
  inset: 0;
  display: flex;
  overflow-y: auto;
  font-family: "MS Sans Serif", "Segoe UI", Tahoma, Geneva, sans-serif;
  padding: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

.win95-window { margin: auto; }

/* Сам пароль выделять можно */
#result {
  user-select: text;
  -webkit-user-select: text;
}

.win95-window {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  width: 100%;
  max-width: 400px;
  box-shadow: 2px 2px 0 #000;
}

.win95-titlebar {
  background: linear-gradient(90deg, #000080, #1084d0);
  color: white;
  font-weight: bold;
  font-size: 13px;
  padding: 3px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.win95-titlebar-buttons {
  display: flex;
  gap: 2px;
}

.win95-btn-sm {
  width: 16px;
  height: 14px;
  background: #c0c0c0;
  border: 1px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  font-size: 8px;
  text-align: center;
  line-height: 14px;
  color: black;
  cursor: default;
  font-weight: bold;
}

.win95-body {
  padding: 12px;
}

.win95-label {
  font-size: 12px;
  margin-bottom: 4px;
  display: block;
}

.win95-row {
  margin-bottom: 10px;
}

.win95-slider {
  width: 100%;
}

.win95-slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.win95-value-box {
  background: #fff;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 2px 6px;
  font-size: 12px;
  min-width: 30px;
  text-align: center;
}

.win95-checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 12px;
}

.win95-checkbox-row input {
  width: 13px;
  height: 13px;
}

.win95-button {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  padding: 6px 18px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  min-width: 100px;
}

.win95-button:active {
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 7px 17px 5px 19px;
}

.win95-button:focus {
  outline: 1px dotted #000;
  outline-offset: -4px;
}

.win95-display {
  background: #fff;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 8px;
  font-family: "Courier New", monospace;
  font-size: 16px;
  min-height: 36px;
  word-break: break-all;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.win95-statusbar {
  background: #c0c0c0;
  border-top: 2px solid #808080;
  border-right: 2px solid #ffffff;
  padding: 3px 6px;
  font-size: 11px;
  display: flex;
  gap: 4px;
}

.win95-statusbar-field {
  flex: 1;
  border: 1px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 2px 4px;
}

.win95-btn-group {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

.win95-fieldset {
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 8px;
  margin-bottom: 10px;
}
/* ---------- Заставка загрузки ---------- */
.boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: linear-gradient(180deg, #3a8ee0 0%, #7fc0f2 55%, #cfeaff 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 20px 60px;
  overflow: hidden;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}

.boot-cloud {
  position: absolute;
  background: rgba(255,255,255,.75);
  border-radius: 50px;
  filter: blur(6px);
  animation: bootDrift 14s linear infinite;
}
.boot-cloud.c1 { width: 180px; height: 46px; top: 12%; left: -10%; }
.boot-cloud.c2 { width: 240px; height: 60px; top: 30%; left: 45%; animation-duration: 20s; }
.boot-cloud.c3 { width: 150px; height: 40px; top: 68%; left: 10%; animation-duration: 17s; }

@keyframes bootDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(60px); }
}

.boot-logo {
  position: relative;
  font-size: 64px;
  line-height: 1;
  margin-bottom: 14px;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,.35));
}

.boot-title {
  position: relative;
  color: #000;
  font-family: "Times New Roman", Times, serif;
  font-size: 30px;
  font-weight: bold;
  text-align: center;
  letter-spacing: .5px;
}

.boot-title b {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 44px;
  color: #fff;
  text-shadow: 2px 2px 0 #000;
  margin-left: 6px;
}

.boot-panel {
  position: relative;
  margin-top: 34px;
  width: 100%;
  max-width: 300px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  box-shadow: 2px 2px 0 #000;
  padding: 10px;
}

.boot-status {
  font-size: 12px;
  margin-bottom: 8px;
  min-height: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.boot-bar {
  height: 20px;
  background: #fff;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 2px;
}

.boot-bar-fill {
  height: 100%;
  width: 0;
  background: repeating-linear-gradient(90deg, #000080 0 10px, transparent 10px 12px);
  animation: bootFill 6.2s steps(24, end) forwards;
}

@keyframes bootFill {
  to { width: 100%; }
}

.boot-strip {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 14px;
  background: linear-gradient(90deg, #000080, #1084d0, #9fd3ff, #1084d0, #000080);
  background-size: 200% 100%;
  animation: bootStrip 1.6s linear infinite;
}

@keyframes bootStrip {
  from { background-position: 200% 0; }
  to   { background-position: 0 0; }
}

</style>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-cloud c1"></div>
  <div class="boot-cloud c2"></div>
  <div class="boot-cloud c3"></div>
  <div class="boot-logo">🔐</div>
  <div class="boot-title">Password Generator<b>95</b></div>
  <div class="boot-panel">
    <div class="boot-status" id="bootStatus">Запуск Password Generator 95...</div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  </div>
  <div class="boot-strip"></div>
</div>
<div class="win95-window">
  <div class="win95-titlebar">
    <span>🔐 Password Generator</span>
    <div class="win95-titlebar-buttons">
      <span class="win95-btn-sm">_</span>
      <span class="win95-btn-sm">□</span>
      <span class="win95-btn-sm">✕</span>
    </div>
  </div>
  <div class="win95-body">
    <div class="win95-row">
      <label class="win95-label" for="lengthSlider">Длина пароля:</label>
      <div class="win95-slider-row">
        <input type="range" min="4" max="32" value="12" class="win95-slider" id="lengthSlider">
        <div class="win95-value-box" id="lengthValue">12</div>
      </div>
    </div>
    <fieldset class="win95-fieldset">
      <legend style="font-size:12px;">Параметры</legend>
      <div class="win95-checkbox-row">
        <input type="checkbox" id="upper" checked>
        <label for="upper">Заглавные буквы (A-Z)</label>
      </div>
      <div class="win95-checkbox-row">
        <input type="checkbox" id="lower" checked>
        <label for="lower">Строчные буквы (a-z)</label>
      </div>
      <div class="win95-checkbox-row">
        <input type="checkbox" id="digits" checked>
        <label for="digits">Цифры (0-9)</label>
      </div>
      <div class="win95-checkbox-row">
        <input type="checkbox" id="symbols" checked>
        <label for="symbols">Спецсимволы (!@#$...)</label>
      </div>
    </fieldset>
    <div class="win95-row">
      <label class="win95-label">Результат:</label>
      <div class="win95-display" id="result">Нажми "Сгенерировать"</div>
    </div>
    <div class="win95-btn-group">
      <button class="win95-button" id="generateBtn">Сгенерировать</button>
      <button class="win95-button" id="copyBtn">Скопировать</button>
    </div>
  </div>
  <div class="win95-statusbar">
    <div class="win95-statusbar-field" id="strengthField">Готово</div>
    <div class="win95-statusbar-field">v1.4</div>
  </div>
</div>

<script>
// ---------- Заставка загрузки ----------
(function () {
  const boot = document.getElementById('boot');
  const status = document.getElementById('bootStatus');
  const BOOT_MS = 6500;
  const steps = [
    'Запуск Password Generator 95...',
    'Проверка памяти: 640 КБ — хватит всем',
    'Загрузка букв A-Z, a-z...',
    'Загрузка цифр и спецсимволов...',
    'Раскрутка генератора случайных чисел...',
    'Почти готово...'
  ];
  let i = 0;
  const ticker = setInterval(() => {
    i++;
    if (i < steps.length) status.textContent = steps[i];
  }, BOOT_MS / steps.length);

  function finish() {
    clearInterval(ticker);
    clearTimeout(timer);
    if (boot.parentNode) boot.parentNode.removeChild(boot);
  }
  const timer = setTimeout(finish, BOOT_MS);
})();

const slider = document.getElementById('lengthSlider');
const lengthValue = document.getElementById('lengthValue');
const result = document.getElementById('result');
const strengthField = document.getElementById('strengthField');
const generateBtn = document.getElementById('generateBtn');
const copyBtn = document.getElementById('copyBtn');
let hasPassword = false;

slider.addEventListener('input', () => { lengthValue.textContent = slider.value; });

function generatePassword() {
  const len = parseInt(slider.value);
  let chars = '';
  let required = [];
  
  if (document.getElementById('upper').checked) {
    chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    required.push(randomFrom('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));
  }
  if (document.getElementById('lower').checked) {
    chars += 'abcdefghijklmnopqrstuvwxyz';
    required.push(randomFrom('abcdefghijklmnopqrstuvwxyz'));
  }
  if (document.getElementById('digits').checked) {
    chars += '0123456789';
    required.push(randomFrom('0123456789'));
  }
  if (document.getElementById('symbols').checked) {
    chars += '!@#$%^&*()-_=+[]{};:,.?';
    required.push(randomFrom('!@#$%^&*()-_=+[]{};:,.?'));
  }
  
  if (chars === '') {
    result.textContent = 'Выберите хотя бы один тип символов!';
    strengthField.textContent = 'Ошибка';
    hasPassword = false;
    return;
  }
  
  const remaining = len - required.length;
  let pwd = required.join('');
  for (let i = 0; i < remaining; i++) {
    pwd += randomFrom(chars);
  }
  pwd = shuffle(pwd);
  result.textContent = pwd;
  
  hasPassword = true;

  // Оценка по энтропии: длина × log2(размер набора символов)
  const bits = Math.round(len * Math.log2(chars.length));
  let strength = 'Слабый';
  if (bits >= 100) strength = 'Очень сильный';
  else if (bits >= 72) strength = 'Сильный';
  else if (bits >= 50) strength = 'Средний';
  strengthField.textContent = 'Надёжность: ' + strength + ' (' + bits + ' бит)';
}

// Криптостойкое случайное целое в диапазоне [0, max) без перекоса
function randomInt(max) {
  const limit = Math.floor(0x100000000 / max) * max;
  const buf = new Uint32Array(1);
  do {
    crypto.getRandomValues(buf);
  } while (buf[0] >= limit);
  return buf[0] % max;
}

function randomFrom(str) {
  return str.charAt(randomInt(str.length));
}

function shuffle(str) {
  const arr = str.split('');
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.join('');
}

generateBtn.addEventListener('click', generatePassword);

function flashCopy(ok) {
  copyBtn.textContent = ok ? 'Скопировано!' : 'Не удалось';
  setTimeout(() => { copyBtn.textContent = 'Скопировать'; }, 1200);
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

copyBtn.addEventListener('click', () => {
  if (!hasPassword) return;
  const text = result.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => flashCopy(true))
      .catch(() => flashCopy(legacyCopy(text)));
  } else {
    flashCopy(legacyCopy(text));
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
